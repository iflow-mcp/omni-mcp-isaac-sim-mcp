[project]
name = "iflow-mcp_omni-mcp-isaac-sim-mcp"
version = "0.1.3"
description = "Isaac Sim MCP Server - Natural language control of NVIDIA Isaac Sim through Model Context Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "omni-mcp", email = ""}
]
keywords = ["mcp", "server", "isaac-sim", "robotics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
isaac-sim-mcp = "isaac_mcp.server:main"
isaac-sim-mcp-mock = "isaac_mcp.server_mock:main"

[project.urls]
Homepage = "https://github.com/omni-mcp/isaac-sim-mcp"
Repository = "https://github.com/omni-mcp/isaac-sim-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isaac_mcp"]